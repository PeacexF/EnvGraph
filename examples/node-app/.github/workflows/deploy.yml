name: Deploy

on:
  push:
    branches: [main]

env:
  NODE_VERSION: "20"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm ci

      # VITE_API_URL is baked in at build time. Nothing supplies it, which is
      # why the front end reads an undefined value at runtime.
      - name: Build
        run: npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
    steps:
      - name: Push the release
        run: |
          echo "deploying to $S3_BUCKET"
          ./scripts/migrate --database "$DATABASE_URL"

          # DEPLOY_TOKEN is never provided by this workflow.
          curl -H "Authorization: $DEPLOY_TOKEN" https://example.invalid/release
