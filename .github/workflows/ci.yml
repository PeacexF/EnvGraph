name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# git bash for windows
defaults:
  run:
    shell: bash

env:
  GO_VERSION: "1.26.2"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l ./cmd ./internal ./tests ./web)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: latest
          install-go: false

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Test
        run: go test -race -shuffle=on -coverprofile=coverage.out -coverpkg=./internal/... ./...

      - name: Report coverage
        if: matrix.os == 'ubuntu-latest'
        run: go tool cover -func=coverage.out | tail -1

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -ldflags "-s -w" -o /dev/null ./cmd/envgraph

  dogfood:
    name: Check its own examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        run: go build -o envgraph ./cmd/envgraph

      # Both examples deliberately contain a missing variable
      - name: Detect the planted problems
        run: |
          for example in examples/*/; do
            echo "--- $example"
            if ./envgraph check "$example"; then
              echo "check passed on $example, but it has a planted missing variable"
              exit 1
            fi
          done

      # EnvGraph ships an .envgraph.yml so it runs clean on itself; if a
      # change introduces real configuration debt, this catches it.
      - name: Check its own configuration
        run: ./envgraph check . --strict

      - name: Export a graph
        run: ./envgraph export examples/simple-go -o - | head -20

      - name: Serve the viewer
        run: |
          ./envgraph serve examples/simple-go --port 8137 &
          pid=$!
          trap "kill $pid" EXIT

          for _ in $(seq 1 20); do
            curl -sf http://127.0.0.1:8137/api/graph >/dev/null && break
            sleep 0.5
          done

          curl -sf http://127.0.0.1:8137/ | grep -q "<title>EnvGraph</title>"
          curl -sf http://127.0.0.1:8137/app.js >/dev/null
          curl -sf http://127.0.0.1:8137/force.js >/dev/null
          curl -sf http://127.0.0.1:8137/vendor/cytoscape.min.js >/dev/null
          curl -sf http://127.0.0.1:8137/api/graph | grep -q '"nodes"'

          if curl -sf http://127.0.0.1:8137/api/graph | grep -q "postgres://localhost"; then
            echo "the viewer served a .env value without --show-values"
            exit 1
          fi
